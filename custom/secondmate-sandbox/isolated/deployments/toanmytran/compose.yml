name: toanmytran

services:
  secondmate:
    build:
      context: ./runtime
    image: secondmate:local
    container_name: toanmytran-bot
    user: "1000:1000"
    hostname: toanmytran-bot
    entrypoint: ["/bin/bash", "/opt/secondmate/entrypoint.sh"]
    restart: "no"
    init: true
    tty: true
    stdin_open: true
    working_dir: /home/nguye
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./secondmate.env
    environment:
      HOME: /home/nguye
      SM_INSTANCE_FILE: /opt/secondmate/instance.json
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - type: bind
        source: ./home
        target: /home/nguye
        bind:
          create_host_path: false
      - type: bind
        source: ./home/toanmytran-bot
        target: /home/nguye/toanmytran-bot
        bind:
          create_host_path: false
      - type: bind
        source: ./runtime
        target: /opt/secondmate
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./instance.json
        target: /opt/secondmate/instance.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data-access/data_client.py
        target: /opt/secondmate/data_client.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/bot-token
        target: /run/secrets/secondmate-bot-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/control-token
        target: /run/secrets/secondmate-control-token
        read_only: true
        bind:
          create_host_path: false
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 4g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tmpfs:
      - /tmp:mode=1777,size=512m
